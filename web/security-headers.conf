# Header di sicurezza applicati su tutte le risposte (include nelle location
# che definiscono un add_header proprio, perche' in nginx l'ereditarieta'
# degli add_header si perde appena una location ne definisce uno suo).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
