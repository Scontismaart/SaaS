server {
    listen 80;
    server_name _;

    # Landing su "/" — dashboard sotto "/app/" (stesso dominio: cookie
    # same-origin per il BFF, nessun CORS).
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # Compressione: app.js+style.css ~150KB non compressi pesano sul first load.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = / {
        try_files /index.html =404;
    }

    # Clean URL per le pagine legali (/privacy/ -> privacy.html)
    location = /privacy     { return 301 /privacy/; }
    location = /termini     { return 301 /termini/; }
    location = /cookie      { return 301 /cookie/; }
    location = /privacy/    { try_files /privacy.html =404; }
    location = /termini/    { try_files /termini.html =404; }
    location = /cookie/     { try_files /cookie.html =404; }

    # Pagine di accesso e registrazione dedicate
    location = /accedi      { return 301 /accedi/; }
    location = /accedi/     { try_files /login.html =404; }
    location = /registrati  { return 301 /registrati/; }
    location = /registrati/ { try_files /register.html =404; }

    # Dashboard: nessun routing URL lato client (nav via data-view):
    # niente fallback che mascherebbe 404 reali.
    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html =404;
    }
    location = /app {
        return 301 /app/;
    }

    # Proxy /api verso il container API (nome servizio compose): rende il
    # sito completamente autonomo su un solo host anche fuori da Traefik
    # (locale/staging). In produzione dietro Traefik la rotta /api può
    # continuare a puntare direttamente al container api: questa location
    # resta semplicemente inutilizzata.
    #
    # Upstream via variabile + resolver Docker (127.0.0.11): la risoluzione
    # avviene a tempo di richiesta, così nginx parte anche quando il
    # container api è assente/spento (502 invece di crash all'avvio).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Plausible (cloud) proxied same-origin: CSP resta script-src 'self',
    # nessun cookie, nessuna richiesta verso domini terzi dal browser.
    # ^~ : salta i blocchi regex asset (\.(css|js)$) che altrimenti
    # catturerebbero /plausible/js/script.js servendolo dal disco (404).
    location ^~ /plausible/ {
        proxy_pass https://plausible.io/;
        proxy_ssl_server_name on;
        proxy_set_header Host plausible.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Immagini/font: cache lunga (i nuovi asset cambiano nome file).
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # CSS/JS: cache corta e niente "immutable". I file non hanno hash nel
    # nome e il ?v= non viene bumpato a ogni edit: con max-age=7d+immutable
    # i visitatori (e il dev) vedono fogli di stile vecchi fino a una
    # settimana. 5 minuti limitano il danno senza costare hit significativi.
    location ~* \.(css|js)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # HTML sempre freschi: il ?v= invalida gli asset quando cambiano.
    location ~* \.html$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

error_page 404 /404.html;

access_log off;
}
