# Header di sicurezza condivisi da tutte le location.
# Tutto è same-origin: niente CDN esterni nel docroot servito.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Nota: HSTS e Permissions-Policy sono aggiunti a monte da Traefik (TLS termina lì).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;
