name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["task9/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.7.4-pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tool
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        env:
          CI: true
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: test
          PGHOST: localhost
          PGPORT: 5432
          ENCRYPTION_KEY: C1IuGfMh142ShEqV9Y2w3WPcMjIjO4aXjbnly7sqlvw=
        run: pytest -v --tb=short -x
