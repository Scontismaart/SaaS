name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Validate application and deployment
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: pgvector/pgvector:0.7.4-pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /usr/local/.ghcup
          sudo apt-get autoremove -y
          sudo apt-get clean

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tool
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/ --select E9,F63,F7,F82

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Frontend lint and DOM tests
        run: |
          npm ci --ignore-scripts
          npm run lint:web
          npm run test:web

      - name: Syntax check (py_compile)
        run: python -m py_compile $(git ls-files 'src/*.py' 'tests/*.py' 'scripts/*.py' '*.py' ':!:scratch/*')

      - name: Tenant scoping check (guard dog)
        run: python scripts/check_tenant_scoping.py

      - name: Deployment checks
        env:
          MELPIS_API_IMAGE: ghcr.io/example/melpis-api
          MELPIS_WEB_IMAGE: ghcr.io/example/melpis-web
          MELPIS_IMAGE_TAG: sha-0000000000000000000000000000000000000000
          MELPIS_ENV_FILE: /dev/null
          PUBLIC_HOST: temporary.example.test
        run: |
          bash tests/scripts/test_oracle_vm_bootstrap.sh
          docker compose -f compose.production.yml config --quiet
          docker run --rm \
            --env PUBLIC_HOST \
            --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Run tests
        env:
          CI: true
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: test
          PGHOST: localhost
          PGPORT: 5432
          TEST_DB_DSN: postgresql://postgres:test@localhost:5432/test
          ENCRYPTION_KEY: C1IuGfMh142ShEqV9Y2w3WPcMjIjO4aXjbnly7sqlvw=
        run: pytest -v --tb=short

  # Pull requests and non-release branches prove both target architectures
  # build successfully, but this job has no package-write permission or login.
  build_images:
    name: Build ${{ matrix.image }} image (no push)
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: ./Dockerfile
          - image: web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build both release architectures
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false

  # Only a validated, direct push to main receives package-write permission.
  # The sole release tag contains the complete commit SHA; no mutable tag is
  # emitted by this workflow.
  publish_images:
    name: Publish ${{ matrix.image }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: ./Dockerfile
          - image: web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        env:
          IMAGE_SUFFIX: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
