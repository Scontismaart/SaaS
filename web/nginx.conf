server {
    listen 80;
    server_name _;

    # Landing su "/" — dashboard sotto "/app/" (stesso dominio: cookie
    # same-origin per il BFF, nessun CORS).
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # Compressione: app.js+style.css ~150KB non compressi pesano sul first load.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = / {
        try_files /index.html =404;
    }

    # Clean URL per le pagine legali (/privacy/ -> privacy.html)
    location = /privacy     { return 301 /privacy/; }
    location = /termini     { return 301 /termini/; }
    location = /cookie      { return 301 /cookie/; }
    location = /privacy/    { try_files /privacy.html =404; }
    location = /termini/    { try_files /termini.html =404; }
    location = /cookie/     { try_files /cookie.html =404; }

    # Dashboard: nessun routing URL lato client (nav via data-view):
    # niente fallback che mascherebbe 404 reali.
    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html =404;
    }
    location = /app {
        return 301 /app/;
    }

    # API proxate a monte da Traefik sullo stesso dominio: qui non si tocca.

    # Asset versionati (?v= in query): cache lunga.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # HTML sempre freschi: il ?v= invalida gli asset quando cambiano.
    location ~* \.html$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

    error_page 404 /404.html;

    access_log off;
}
