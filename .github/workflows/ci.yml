name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: pgvector/pgvector:0.7.4-pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /usr/local/.ghcup
          sudo apt-get autoremove -y
          sudo apt-get clean

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint tool
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/ --select E9,F63,F7,F82

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Frontend lint and DOM tests
        run: |
          npm ci --ignore-scripts
          npm run lint:web
          npm run test:web

      - name: Syntax check (py_compile)
        run: python -m py_compile $(git ls-files 'src/*.py' 'tests/*.py' 'scripts/*.py' '*.py' ':!:scratch/*')

      - name: Tenant scoping check (guard dog)
        run: python scripts/check_tenant_scoping.py

      - name: Run tests
        env:
          CI: true
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: test
          PGHOST: localhost
          PGPORT: 5432
          TEST_DB_DSN: postgresql://postgres:test@localhost:5432/test
          ENCRYPTION_KEY: C1IuGfMh142ShEqV9Y2w3WPcMjIjO4aXjbnly7sqlvw=
        run: pytest -v --tb=short
