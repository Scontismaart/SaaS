server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Header di sicurezza: ereditati dalle location che NON ne definiscono
    # di propri; le location sotto li includono esplicitamente via include.
    include /etc/nginx/conf.d/security-headers.conf;

    # Il frontend NON ha routing URL (navigazione via data-view): nessun
    # fallback try_files su index.html che maschereerebbe 404 reali.
    location / {
        try_files $uri $uri/ =404;
    }

    # Asset versionati (?v= in query string): cache lunga. index.html non va
    # mai cachato, cosi' il ?v= invalida subito gli asset quando cambiano.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

    access_log off;
}