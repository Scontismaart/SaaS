# Header di sicurezza condivisi da tutte le location.
# Tutto è same-origin: niente CDN esterni nel docroot servito.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Nota: HSTS e Permissions-Policy sono aggiunti a monte da Traefik (TLS termina lì).
# FullCalendar and dashboard state use CSSOM style attributes for geometry and
# progress values. Scope compatibility to attributes; style elements remain self-only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
